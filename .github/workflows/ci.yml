name: ci

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'config.example.**'
      - '**.sh'
      - '**.json'
      - '**.yml'
      - '!.github/workflows/**'

jobs:
  check:
    name: Review the code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check
      run: |
        cargo fmt --all -- --check
        cargo test --locked
        cargo clippy --locked --all-targets
    - name: Dependency security audit
      run: python3 scripts/audit-dependencies.py --report target/dependency-audit.json

  build:
    name: Build the binary file
    if: ${{ github.event_name != 'pull_request' && success() }}
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
    - uses: actions/checkout@v3

    - name: Build
      run: |
        docker run -i --rm \
        -v $PWD:/workdir \
        -v ~/.cargo/git:/root/.cargo/git \
        -v ~/.cargo/registry:/root/.cargo/registry \
        registry.gitlab.com/rust_musl_docker/image:stable-latest \
        cargo build --locked --profile=fast -vv --target=x86_64-unknown-linux-musl
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: biliroaming-rust-server-${{ github.run_number }}
        path: |
          ./target/x86_64-unknown-linux-musl/fast/biliroaming_rust_server
  
  alpha:
    name: Upload the Alpha test version file
    runs-on: ubuntu-latest
    needs:
      - build
    # 创建/更新 release 需要写权限；仓库默认 workflow 权限是 read，
    # 不显式声明会因 GITHUB_TOKEN 无权创建 release 而失败。
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: biliroaming-rust-server-${{ github.run_number }}
    - name: Update Alpha Release
      # v1.1.3 的镜像基于 Debian buster（已 EOL，apt 源 404），容器构建必然失败；
      # v1.2.0 起改用 python:3.12-alpine。
      uses: mini-bomba/create-github-release@v1.2.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true
        tag: alpha-releases
        name: Alpha-Release
        # 原先引用的 env.GIT_HASH / env.GIT_MESSAGE 从未被赋值（workflow 里只有引用），
        # 改为使用 GitHub 内置上下文。
        body: |
            This automatic prerelease is built from commit ${{ github.sha }} and was triggered by @${{ github.actor }}
            [Github Actions workflow run that built this prerelease](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Commit message:
            ${{ github.event.head_commit.message }}
        files: |
          ./biliroaming_rust_server
        clear_attachments: true

  release:
    name: Upload the binary file when it is released
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
    runs-on: ubuntu-latest
    # 同 alpha：创建 release 需要 contents: write。
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: biliroaming-rust-server-${{ github.run_number }}
    - name: Release
      # v1 是 2022 年的旧 tag；v2 与现有 files/token 用法兼容。
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./biliroaming_rust_server
